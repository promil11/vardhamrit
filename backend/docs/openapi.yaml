openapi: 3.0.3
info:
  title: Vardhamrit Chai E-Commerce Production REST API
  description: High-performance, scalable REST API for Vardhamrit Chai built on Node.js/Express, MySQL (InnoDB utf8mb4), and Redis. Designed for 1M+ users.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development / Staging Server
paths:
  /auth/login:
    post:
      summary: User Login (Customer & Admin)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  example: customer@vardhamrit.com
                password:
                  type: string
                  example: Customer@123
      responses:
        200:
          description: Successful authentication with JWT access and refresh tokens.

  /categories:
    get:
      summary: List all active tea categories
      description: Returns categories with styling gradients, icon names, and dynamic product counts. Cached in Redis for 10 minutes.
      tags: [Categories]
      parameters:
        - in: query
          name: featured
          schema:
            type: boolean
          description: Filter featured categories only
      responses:
        200:
          description: List of categories

  /categories/{slug}:
    get:
      summary: Get category detail with tasting notes & brewing hero metadata
      tags: [Categories]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          example: kadak
      responses:
        200:
          description: Category object with hero metadata

  /products:
    get:
      summary: List products with multi-criteria filtering, sorting, and pagination
      tags: [Products]
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: featured
          schema:
            type: boolean
        - in: query
          name: bestseller
          schema:
            type: boolean
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, price_asc, price_desc, rating, popular]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Paginated product array with variants, badges, and images

  /products/{id}:
    get:
      summary: Get detailed product specification by ID or slug
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Product details with full variants and rating breakdown

  /content/banners:
    get:
      summary: Get active promotional carousel banners
      tags: [Marketing & Content]
      responses:
        200:
          description: Array of banners

  /content/promotions/flash-deal:
    get:
      summary: Get active high-energy flash deal promotion with live countdown seconds
      tags: [Marketing & Content]
      responses:
        200:
          description: Promotion object

  /orders:
    get:
      summary: Get authenticated user order history
      security:
        - BearerAuth: []
      tags: [Orders]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        200:
          description: User orders with item snapshots, courier info, and tracking status

    post:
      summary: Place a new order with atomic transactional row locking
      security:
        - BearerAuth: []
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId, paymentMethod]
              properties:
                addressId:
                  type: integer
                paymentMethod:
                  type: string
                  enum: [ONLINE, COD]
                couponCode:
                  type: string
      responses:
        201:
          description: Order created successfully

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
